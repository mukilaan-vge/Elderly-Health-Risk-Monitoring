services:
  api:
    build: .
    container_name: elderly-health-risk-api

    ports:
      - "8000:8000"

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns

    restart: unless-stopped